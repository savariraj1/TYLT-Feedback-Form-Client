<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TYLT Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="CSS/dashboard.css">

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:white;
            font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
        }

        .login-card{

            width:420px;
            background:#fff;
            border-radius:20px;
            padding:40px;
            box-shadow:0 20px 45px rgba(0,0,0,.18);

        }

        .logo{

            width:80px;
            display:block;
            margin:auto;
            margin-bottom:15px;

        }

        h2{

            text-align:center;
            font-weight:700;

        }

        .subtitle{

            text-align:center;
            color:#777;
            margin-bottom:30px;

        }

        .form-control{

            height:50px;
            border-radius:10px;

        }

        .btn-login{

            height:50px;
            border-radius:10px;
            font-size:18px;
            font-weight:600;

        }

        .input-group-text{

            background:white;

        }

    </style>

</head>

<body>

<div class="login-card">

    <img src="Image/logo.png" class="logo">

    <h2>TYLT Mobility</h2>

    <p class="subtitle">
        Admin Dashboard Login
    </p>

    <form id="loginForm">

        <div class="mb-3">

            <label class="form-label">
                Username
            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-person-fill"></i>

                </span>

                <input
                    type="text"
                    id="username"
                    class="form-control"
                    placeholder="Enter Username"
                    required>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock-fill"></i>

                </span>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter Password"
                    required>

            </div>

        </div>

        <button
            type="submit"
            class="btn btn-primary btn-login w-100">

            <i class="bi bi-box-arrow-in-right"></i>

            Login

        </button>

    </form>

</div>

<script src="JS/login.js"></script>

</body>

</html>
