<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TYLT Mobility Feedback</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- <link rel="stylesheet" href="style.css"> -->
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>
<div class="container-fluid py-5">

<div class="row justify-content-center">

<div class="col-12 col-sm-11 col-md-10 col-lg-8 col-xl-7">
<div id="feedbackContainer">
    <div class="card shadow-lg">
    <!-- 
    <div class="container py-5">
    
    <div class="row justify-content-center">
    
    <div class="col-lg-8">
    
    <div class="card shadow-lg"> -->
    
    <div class="card-header text-center bg-primary text-white">
    
    <h2>🚗 TYLT Mobility</h2>
    
    <p class="mb-0">
    Customer Feedback Form
    </p>
    
    </div>
    
    <div class="card-body">
    
    <h5 class="mb-4">
    Trip Details
    </h5>
    
    <div class="row">
    
    <div class="col-md-6 mb-3">
    
    <label>Booking ID</label>
    
    <input
    id="bookingId"
    type="text"
    class="form-control"
    readonly>
    <!-- <input
    type="text"
    class="form-control"
    value="TYLT000123"
    readonly> -->
    
    </div>
    
    <div class="col-md-6 mb-3">
    
    <label>Customer Name</label>
    
    <input
    id="customerName"
    type="text"
    class="form-control"
    readonly>
    <!-- <input
    type="text"
    class="form-control"
    value="Raj Kumar"
    readonly> -->
    
    </div>
    
    <div class="col-md-6 mb-3">
    
    <label>Company</label>
    
    <input
    id="companyName"
    type="text"
    class="form-control"
    readonly>
    <!-- <input
    type="text"
    class="form-control"
    value="ABC Technologies"
    readonly> -->
    
    </div>
    
    <div class="col-md-6 mb-3">
    
    <label>Trip Date</label>
    
    <input
    id="tripDate"
    type="text"
    class="form-control"
    readonly>
    <!-- <input
    type="text"
    class="form-control"
    value="15-Jul-2026"
    readonly> -->
    
    </div>
    
    <div class="col-md-6 mb-3">
    
    <label>Driver Name</label>
    
    <input
    id="driverName"
    type="text"
    class="form-control"
    readonly>
    <!-- <input
    type="text"
    class="form-control"
    value="Ravi Kumar"
    readonly> -->
    
    </div>
    
    <div class="col-md-6 mb-3">
    
    <label>Vehicle Number</label>
    
    <input
    id="vehicleNumber"
    type="text"
    class="form-control"
    readonly>
    <!-- <input
    type="text"
    class="form-control"
    value="KA01AB1234"
    readonly> -->
    
    </div>
    
    </div>
    
    <hr>
    
    <h5 class="mb-3">
    Service Feedback
    </h5>
    
    <form id="feedbackForm">
    
    <div class="mb-4">
    
    <label class="fw-bold">
    
    Overall Experience
    
    </label>
    
    <select id="overallRating" class="form-select">
    <!-- <select class="form-select"> -->
    
    <option>⭐⭐⭐⭐⭐ Excellent</option>
    <option>⭐⭐⭐⭐ Good</option>
    <option>⭐⭐⭐ Average</option>
    <option>⭐⭐ Fair</option>
    <option>⭐ Poor</option>
    
    </select>
    
    </div>
    
    <div class="mb-4">
    
    <label class="fw-bold">
    
    Driver Professionalism
    
    </label>
    <select id="driverRating" class="form-select">
    <!-- <select class="form-select"> -->
    
    <option>⭐⭐⭐⭐⭐ Excellent</option>
    <option>⭐⭐⭐⭐ Good</option>
    <option>⭐⭐⭐ Average</option>
    <option>⭐⭐ Fair</option>
    <option>⭐ Poor</option>
    
    </select>
    
    </div>
    
    <div class="mb-4">
    
    <label class="fw-bold">
    
    Vehicle Cleanliness
    
    </label>
    
    <select id="cleanlinessRating" class="form-select">
    <!-- <select class="form-select"> -->
    
    <option>⭐⭐⭐⭐⭐ Excellent</option>
    <option>⭐⭐⭐⭐ Good</option>
    <option>⭐⭐⭐ Average</option>
    <option>⭐⭐ Fair</option>
    <option>⭐ Poor</option>
    
    </select>
    
    </div>
    
    <div class="mb-4">
    
    <label class="fw-bold">
    
    Punctuality
    
    </label>
    
    <select id="punctualityRating" class="form-select">
    <!-- <select class="form-select"> -->
    
    <option>⭐⭐⭐⭐⭐ Excellent</option>
    <option>⭐⭐⭐⭐ Good</option>
    <option>⭐⭐⭐ Average</option>
    <option>⭐⭐ Fair</option>
    <option>⭐ Poor</option>
    
    </select>
    
    </div>
    
    <div class="mb-4">
    
    <label class="fw-bold">
    
    Would you recommend TYLT Mobility?
    
    </label>
    
    <div class="form-check">
    
    <input class="form-check-input" type="radio" name="recommend" value="Yes">
    
    <label class="form-check-label">
    
    Yes
    
    </label>
    
    </div>
    
    <div class="form-check">
    
    <input class="form-check-input" type="radio" name="recommend" value="Maybe">
    
    <label class="form-check-label">
    
    Maybe
    
    </label>
    
    </div>
    
    <div class="form-check">
    
    <input class="form-check-input" type="radio" name="recommend" value="No">
    
    <label class="form-check-label">
    
    No
    
    </label>
    
    </div>
    
    </div>
    
    <div class="mb-4">
    
    <label class="fw-bold">
    
    Suggestions
    
    </label>
    
    <textarea
    id="comments"
    class="form-control"
    rows="4"
    placeholder="Share your feedback..."></textarea>
    
    <!-- <textarea
    class="form-control"
    rows="4"
    placeholder="Share your feedback..."></textarea> -->
    
    </div>
    
    <button
    type="submit" class="btn btn-primary w-100">
    
    Submit Feedback
    
    </button>
    
    </form>
    
    </div>
    
    </div>
</div>

<div
    id="thankYouMessage"
    class="text-center mt-5"
    style="display:none;">

    <div class="card shadow p-5">

        <h1 class="text-success">
            ✅ Thank You!
        </h1>

        <h4 class="mt-3">
            Your feedback has been submitted successfully.
        </h4>

        <p class="text-muted mt-2">
            Thank you for choosing TYLT Mobility.
        </p>

    </div>

</div>
</div>

</div>

</div>


<script src="/config.js"></script>
<script src="./JS/script.js"></script>

</body>
</html>
